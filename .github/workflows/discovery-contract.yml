name: Discovery Contract Checks

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Trust model: the private-name list is given only to code that is already on main
      # (a push to main = state accepted by someone with write access to main).
      # Pull requests, forks and other branches never receive it; there the check is
      # reported as NOT PERFORMED. Detection after a push is not prevention.
      - name: Validate discovery graph and adapters (without private-name list)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: python scripts/validate_discovery.py

      - name: Validate discovery graph and adapters (main, with private-name list)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BAIBLE_PRIVATE_NAMES: ${{ secrets.BAIBLE_PRIVATE_NAMES }}
        run: python scripts/validate_discovery.py --require-private-names

      - name: Build core single-file AI context bundle
        run: python scripts/build_ai_context.py --profile core --output dist/BAIBLE_AI_CONTEXT.md

      - name: Build full single-file AI context bundle
        run: python scripts/build_ai_context.py --profile full --output dist/BAIBLE_AI_CONTEXT_FULL.md

      - name: Upload generated AI context bundles
        uses: actions/upload-artifact@v4
        with:
          name: baible-ai-context
          path: |
            dist/BAIBLE_AI_CONTEXT.md
            dist/BAIBLE_AI_CONTEXT_FULL.md
